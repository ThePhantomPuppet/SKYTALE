name = "scytale"
main = "worker/index.ts"
compatibility_date = "2026-07-27"

# Custom domain. The zone skytale.chat is in this Cloudflare account (bought on CF),
# so custom_domain = true makes Cloudflare create the proxied DNS record and the TLS
# cert automatically on deploy — no manual DNS. The worker keeps its internal name
# ("scytale") so the existing Durable Object and deploy history stay attached.
#
# workers_dev MUST stay true: scytale.illogical.workers.dev is an intentionally supported
# production origin, including for the existing installed-PWA fleet. Setting this to false
# would brick those installations (no service-worker update and no relay connection). The
# Worker therefore applies the same HTTPS redirect and response headers to both production
# origins; the second ingress is an explicit operating requirement, not stale migration debt.
workers_dev = true
routes = [
  { pattern = "skytale.chat", custom_domain = true },
]

# Web Push (VAPID). These are PUBLIC and safe to commit. The matching private
# key is set separately as the secret VAPID_JWK (never in the repo):
#   npx wrangler secret put VAPID_JWK
[vars]
VAPID_PUBLIC = "BCvQuiivhlyNteecWKop_2Jh-cPdK_V8UeiSwgyt8_yPzbduj6dQf6fAJkqOTaVZXMaIsUCb0l8VLLJV8aVuzAo"
VAPID_SUBJECT = "https://skytale.chat"

# Serve the built PWA (dist/) directly from the Worker. Non-asset routes fall
# through to the Worker's fetch handler (which owns /api/relay).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Every asset response must pass through worker/index.ts so security headers,
# HTTPS redirects, and service-worker cache policy cannot be bypassed.
run_worker_first = true

# The relay lives in a Durable Object. SQLite-backed DOs run on the free tier.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayRoom"

[[durable_objects.bindings]]
name = "BLOB_QUOTA"
class_name = "BlobQuota"

[[durable_objects.bindings]]
name = "RELAY_GUARD"
class_name = "RelayActorGuard"

[[durable_objects.bindings]]
name = "CONTACT_CODES"
class_name = "ContactCode"

[[durable_objects.bindings]]
name = "OFFICIAL_ACCOUNTS"
class_name = "OfficialAccountDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BlobQuota"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RelayActorGuard"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ContactCode"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["OfficialAccountDirectory"]

# R2 object storage for LARGE attachments (videos) that don't fit the relay mailbox.
# The client encrypts the file CLIENT-SIDE under a random per-file key before upload, so
# R2 only ever holds ciphertext; the key travels end-to-end in the sealed message. Upload
# + download go through this Worker (same origin → CSP connect-src 'self' stays intact).
# Create the bucket once:  npx wrangler r2 bucket create skytale-blobs
# Apply the repository-controlled retention policy:
#   npx wrangler r2 bucket lifecycle set skytale-blobs --file ./r2-lifecycle.json
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "skytale-blobs"

# Coarse edge brakes. Security-critical mailbox and storage limits are additionally
# enforced inside their strongly-consistent Durable Objects.
[[ratelimits]]
name = "RELAY_RATE"
namespace_id = "290001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "UPLOAD_RATE"
namespace_id = "290002"
simple = { limit = 240, period = 60 }

[[ratelimits]]
name = "CONTACT_CREATE_RATE"
namespace_id = "290004"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "CONTACT_RESOLVE_RATE"
namespace_id = "290005"
simple = { limit = 60, period = 60 }

# Public official-account reads and rare offline-root-authorised publishes have
# independent actor buckets so neither can starve ordinary contact-code usage.
[[ratelimits]]
name = "OFFICIAL_ACCOUNT_READ_RATE"
namespace_id = "290006"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "OFFICIAL_ACCOUNT_PUBLISH_RATE"
namespace_id = "290007"
simple = { limit = 10, period = 60 }

[observability]
enabled = true
head_sampling_rate = 0.1

# Invocation logs persist the complete request URL. Relay inbox ids and blob
# capabilities live in URLs, so retain privacy-safe custom logs/metrics but do
# not store automatic request metadata in Workers Logs.
[observability.logs]
invocation_logs = false
